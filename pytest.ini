[pytest]
pythonpath = .
testpaths = BackEnd/tests
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
branch = False
source = BackEnd
omit =
    BackEnd/tests/*
    BackEnd/__pycache__/*

[coverage:report]
show_missing = True
skip_covered = False
# Meta pedida: ≥60% em auth e users (verificados no CI local via --cov).
# fail_under global omitido para não penalizar módulos ainda sem testes.
