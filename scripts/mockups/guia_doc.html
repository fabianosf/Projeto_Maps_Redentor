<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=360, initial-scale=1" />
  <title>Tela 06 - Guia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; height: 800px; overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #B9C8D4; color: #0f172a;
    }
    header {
      height: 56px; background: #1e3a5f; color: #fff;
      display: flex; align-items: center; padding: 0 8px; gap: 4px;
    }
    header button.icon {
      width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.25);
      border-radius: 6px; background: transparent; color: #fff; font-size: 22px;
    }
    header h1 {
      flex: 1; text-align: center; font-size: 17px; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase; margin-right: 44px;
    }
    main {
      padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px;
      height: calc(800px - 56px);
    }
    .panel {
      border: 2px solid rgba(100,116,139,.4); border-radius: 12px;
      background: rgba(255,255,255,.5); padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label {
      font-size: 13px; font-weight: 600; text-transform: uppercase; color: #0f172a;
    }
    input, .select-box, textarea.obs {
      border: 1px solid #94a3b8; border-radius: 8px;
      background: #fff; padding: 0 12px; font-size: 14px;
    }
    input, .select-box {
      height: 40px;
      display: flex; align-items: center;
    }
    textarea.obs {
      width: 100%; height: 40px; min-height: 40px; padding: 8px 12px; resize: none;
      font-family: inherit; line-height: 1.35;
    }
    .half { width: 50%; }
    .full { width: 100%; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row2 input, .row2 .select-box { width: 100%; }
    .select-box { position: relative; padding-right: 28px; }
    .select-box::after {
      content: '▾'; position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%); color: #64748b; font-size: 16px;
    }
    .label-row {
      display: flex; align-items: center; height: 20px;
    }
    .label-row .cal-btn {
      margin-left: 2.5cm; width: 16px; height: 16px; border: 0; background: transparent;
      color: #1e3a5f; padding: 0; display: flex; align-items: center; justify-content: center;
    }
    .label-row .cal-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.25; }
    .footer-actions {
      margin-top: auto;
      transform: translateY(-3mm);
    }
    .sep { height: 1px; background: #000; margin-top: 1mm; }
    .toolbar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      padding-top: 10px; margin-top: -1mm;
    }
    .tb {
      height: 78px; border: 1px solid #1e3a5f; border-radius: 12px;
      background: #1e3a5f; color: #fff; font-size: 11px; font-weight: 700;
      text-transform: uppercase; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
    }
    .tb svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.25; }
  </style>
</head>
<body>
  <header>
    <button class="icon" aria-label="Voltar">‹</button>
    <h1>Guia</h1>
  </header>
  <main>
    <div class="panel">
      <div class="row2">
        <div class="field">
          <label>NR(Guia)</label>
          <input value="4726607385" readonly />
        </div>
        <div class="field">
          <div class="label-row">
            <label>Data</label>
            <button class="cal-btn" type="button" aria-label="Calendário">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </button>
          </div>
          <input value="01/09/2026" readonly />
        </div>
      </div>
      <div class="field">
        <label>Empresa</label>
        <div class="select-box full">Redentor</div>
      </div>
      <div class="field">
        <label>Linha</label>
        <div class="select-box full">565 Tanque - Gávea</div>
      </div>
      <div class="field">
        <label>Turno</label>
        <div class="select-box full">1</div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Carro</label>
          <input value="47451" readonly />
        </div>
        <div class="field">
          <label>Motorista</label>
          <input value="59491" readonly />
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>INÍCIO(JORNADA)</label>
          <input value="05:00" readonly />
        </div>
        <div class="field">
          <label>FIM(JORNADA)</label>
          <input value="12:00" readonly />
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>ROLETA 01(INICIAL)</label>
          <input value="1200" readonly />
        </div>
        <div class="field">
          <label>ROLETA 01(FINAL)</label>
          <input value="1500" readonly />
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>ROLETA 02(INICIAL)</label>
          <input value="" readonly />
        </div>
        <div class="field">
          <label>ROLETA 02(FINAL)</label>
          <input value="" readonly />
        </div>
      </div>
      <div class="field">
        <label>Observação</label>
        <textarea class="obs" readonly></textarea>
      </div>
    </div>
    <div class="footer-actions">
    <div class="sep"></div>
    <div class="toolbar">
      <button class="tb" type="button">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
        Novo
      </button>
      <button class="tb" type="button">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
        Salvar
      </button>
      <button class="tb" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
        Deletar
      </button>
      <button class="tb" type="button">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        Pesquisar
      </button>
    </div>
    </div>
  </main>
</body>
</html>
