<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=360, initial-scale=1" />
  <title>Tela 09 - Configuração</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; height: 800px; overflow: hidden;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #B9C8D4; color: #0f172a;
    }
    header {
      height: 56px; background: #1e3a5f; color: #fff;
      display: flex; align-items: center; padding: 0 8px; gap: 4px;
    }
    header button {
      width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.25);
      border-radius: 6px; background: transparent; color: #fff; font-size: 22px;
    }
    header h1 {
      flex: 1; text-align: center; font-size: 16px; font-weight: 400;
      letter-spacing: .06em; text-transform: uppercase; margin-right: 44px;
    }
    main {
      padding: 32px 16px 24px;
      display: flex; flex-direction: column;
      height: calc(800px - 56px);
    }
    .btn-row {
      display: flex; justify-content: center; align-items: flex-start;
      width: 100%; padding: 0 4px; gap: 2.5cm;
    }
    .tb {
      width: calc(88px + 1.5cm + 2mm); height: calc(39px + 6mm); border-radius: 8px;
      border: 1px solid rgba(154, 171, 196, 0.7);
      background: linear-gradient(180deg, #C8D6E8 0%, #B0C4DE 55%, #8FA8C9 100%);
      color: #0f172a; font-size: 12px; font-weight: 700;
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: 4px; padding: 0 4px; line-height: 1.05; text-align: center;
      box-shadow:
        0 6px 14px rgba(15, 23, 42, 0.22),
        inset 0 2px 4px rgba(255, 255, 255, 0.45),
        inset 0 -4px 7px rgba(70, 90, 120, 0.25);
      cursor: default; font-family: inherit;
    }
    .tb svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.25; flex-shrink: 0; }
    .tb svg.ind-icon-colored { fill: initial; stroke-width: initial; }
    .tb span.label { font-size: 11px; font-weight: 700; text-transform: none; line-height: 1.05; }
    .field { margin-top: 28px; padding: 0 4px; }
    .field-check {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
      font-size: 12px; font-weight: 400; line-height: 1.25;
    }
    .field-check input[type=checkbox] {
      width: 16px; height: 16px; accent-color: #1e3a5f; flex-shrink: 0;
    }
    .field-row-qtd {
      display: flex; align-items: center; gap: 8px; margin-top: 4px;
    }
    .field label.field-label {
      display: block; font-size: 12px; font-weight: 400; margin-bottom: 0;
      white-space: nowrap;
    }
    .field input.input-qtd {
      width: 48px; height: 40px; border: 1px solid #94a3b8; border-radius: 8px;
      background: #fff; padding: 0 8px; font-size: 14px; text-align: center;
    }
    .sep { margin-top: 28px; border: 0; border-top: 2px solid #000; margin-bottom: 0; }
    .footer { margin-top: auto; padding-top: 24px; }
    .btn-confirm {
      width: 100%; max-width: 320px; margin: 0 auto; display: block;
      height: 48px; border-radius: 8px;
      border: 1px solid rgba(154, 171, 196, 0.7);
      background: linear-gradient(180deg, #C8D6E8 0%, #B0C4DE 55%, #8FA8C9 100%);
      box-shadow:
        0 6px 14px rgba(15, 23, 42, 0.22),
        inset 0 2px 4px rgba(255, 255, 255, 0.45),
        inset 0 -4px 7px rgba(70, 90, 120, 0.25);
      color: #0f172a; font-size: 17px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.02em;
      cursor: default; font-family: inherit;
    }
  </style>
</head>
<body>
  <header>
    <button aria-label="Voltar">‹</button>
    <h1>CONFIGURAÇÃO</h1>
  </header>
  <main>
    <div class="btn-row">
      <button class="tb" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M6 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke-linecap="round"/>
          <path d="M19 8v2M19 13h2M19 18v2" stroke-linecap="round"/>
        </svg>
        <span class="label">Cadastro de usuários</span>
      </button>
      <button class="tb" type="button">
        <svg class="ind-icon-colored" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
          <rect x="6.5" y="13" width="3" height="5" rx="0.75" fill="#2563EB"/>
          <rect x="10.5" y="10" width="3" height="8" rx="0.75" fill="#16A34A"/>
          <rect x="14.5" y="7" width="3" height="11" rx="0.75" fill="#EA580C"/>
          <path d="M7 9.5 L11 8 L14.5 10 L17.5 6.5" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="17.5" cy="6.5" r="1.2" fill="#7C3AED"/>
        </svg>
        <span class="label">Indicadores</span>
      </button>
    </div>

    <hr class="sep" />

    <div class="field">
      <label class="field-check">
        <input type="checkbox" checked readonly />
        Login (Bloqueio de tentativas de acesso):
      </label>
      <div class="field-row-qtd">
        <label class="field-label" for="qtd">QTD:</label>
        <input class="input-qtd" id="qtd" value="3" readonly maxlength="1" />
      </div>
    </div>

    <div class="footer">
      <button class="btn-confirm" type="button">Confirmar</button>
    </div>
  </main>
</body>
</html>
