<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=360, initial-scale=1" />
  <title>Tela 07 - Mensagem</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; height: 800px; overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #B9C8D4; color: #0f172a;
    }
    header {
      height: 56px; background: #1e3a5f; color: #fff;
      display: flex; align-items: center; padding: 0 8px; gap: 4px;
    }
    header button.icon {
      width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.25);
      border-radius: 6px; background: transparent; color: #fff; font-size: 22px;
    }
    header h1 {
      flex: 1; text-align: center; font-size: 17px; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase; margin-right: 44px;
    }
    main {
      position: relative;
      padding: 12px 16px 16px;
      height: calc(800px - 56px);
    }
    .panel {
      border: 2px solid rgba(100,116,139,.4); border-radius: 12px;
      background: rgba(255,255,255,.5); padding: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field-carro { width: 50%; }
    .field label {
      font-size: 15px; font-weight: 600; color: #0f172a;
      font-family: inherit;
    }
    .input, .select-box {
      width: 100%; height: 40px;
      border: 1px solid #000; border-radius: 8px;
      background: #fff; padding: 0 12px;
      font-family: inherit; font-size: 15px; font-weight: 700; color: #0f172a;
    }
    .select-box {
      display: flex; align-items: center; justify-content: space-between;
      color: #64748b;
    }
    .select-box.selected { color: #0f172a; }
    .select-box svg { width: 16px; height: 16px; color: #64748b; flex-shrink: 0; }
    textarea.texto {
      width: 100%; height: 7cm;
      border: 1px solid #000; border-radius: 8px;
      background: #fff; padding: 8px 12px; resize: none;
      font-family: inherit; font-size: 15px; line-height: 1.35; color: #0f172a;
      font-weight: 700;
      text-align: justify;
      text-align-last: left;
      text-justify: inter-word;
      word-spacing: normal;
      hyphens: auto;
    }
    .footer {
      position: absolute;
      left: 16px;
      right: 16px;
      top: calc(50vh + 3.5cm);
    }
    .sep { height: 1px; background: #000; }
    .actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 12px;
    }
    .btn-3d {
      height: 48px; border-radius: 8px;
      border: 1px solid rgba(154, 171, 196, 0.7);
      background: linear-gradient(180deg, #C8D6E8 0%, #B0C4DE 55%, #8FA8C9 100%);
      box-shadow:
        0 6px 14px rgba(15, 23, 42, 0.22),
        inset 0 2px 4px rgba(255, 255, 255, 0.45),
        inset 0 -4px 7px rgba(70, 90, 120, 0.25);
      color: #0f172a; font-size: 16px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.02em;
      cursor: default; font-family: inherit;
    }
  </style>
</head>
<body>
  <header>
    <button class="icon" type="button" aria-label="Voltar">‹</button>
    <h1>MENSAGEM</h1>
  </header>
  <main>
    <div class="panel">
      <div class="field field-carro">
        <label for="carro">Carro:</label>
        <input class="input" id="carro" value="30342" readonly />
      </div>
      <div class="field">
        <label for="avaria">Avaria:</label>
        <div class="select-box selected" id="avaria">
          PORTA QUEBRADA
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </div>
      </div>
      <div class="field">
        <label for="texto">Texto:</label>
        <textarea id="texto" class="texto" lang="pt-BR" readonly>Causada por impacto de pedra, devido a vandalismo durante atividade esportiva nas proximidades do estádio Mario Filho (Maracanã).</textarea>
      </div>
    </div>
    <div class="footer">
      <div class="sep"></div>
      <div class="actions">
        <button class="btn-3d" type="button">Enviar</button>
        <button class="btn-3d" type="button">Cancelar</button>
      </div>
    </div>
  </main>
</body>
</html>
