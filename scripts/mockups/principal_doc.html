<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=360, initial-scale=1" />
  <title>Tela 04 - Principal (RedMapa)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; height: 800px; overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #B0C4DE; color: #0f172a;
      border: 1px solid #94a3b8;
    }
    header {
      height: 56px; background: #1e3a5f; color: #fff;
      display: flex; align-items: center; padding: 0 8px; gap: 4px;
    }
    header button.icon {
      width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.25);
      border-radius: 6px; background: transparent; color: #fff; font-size: 22px;
    }
    header h1 {
      flex: 1; text-align: center; font-size: 17px; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase; margin-right: 44px;
    }
    .action-bar {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 10px; padding: 12px 16px 12px 16px;
      padding-right: calc(16px - 2mm);
      flex-shrink: 0;
    }
    .tb {
      width: 88px; height: 39px; border-radius: 8px;
      border: 1px solid rgba(148,163,184,.9);
      background: linear-gradient(180deg, #E8EDF3 0%, #D8E0EA 55%, #C5CED9 100%);
      color: #1e3a5f; font-size: 9px; font-weight: 700;
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: 4px; padding: 0 4px; line-height: 1.05; text-align: center;
      box-shadow:
        0 4px 9px rgba(15, 23, 42, 0.2),
        inset 0 2px 3px rgba(255, 255, 255, 0.95),
        inset 0 -3px 5px rgba(100, 116, 139, 0.2);
    }
    .tb svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.25; flex-shrink: 0; }
    .tb.config span.label { font-size: 8px; }
    main { height: calc(800px - 56px); display: flex; flex-direction: column; background: #B0C4DE; }
    .section-divider {
      margin: 0 1.5mm; border-top: 2px solid #000; flex-shrink: 0;
    }
    .bottom-actions {
      display: flex; flex-direction: column; align-items: center;
      padding: 0 24px calc(32px - 3mm); margin-top: auto; flex-shrink: 0;
    }
    .guia-divider {
      margin: 2mm 1.5mm 1cm;
      border-top: 2px solid #000; flex-shrink: 0;
    }
    .bottom-actions-buttons {
      display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%;
      padding-top: 0;
    }
    .btn-action {
      width: 100%; max-width: 280px; height: 56px; border-radius: 8px;
      border: 1px solid rgba(154,171,196,.7);
      background: linear-gradient(180deg, #C8D6E8 0%, #B0C4DE 55%, #8FA8C9 100%);
      color: #0f172a; font-size: 14px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow:
        0 6px 14px rgba(15, 23, 42, 0.32),
        inset 0 2px 4px rgba(255, 255, 255, 0.22),
        inset 0 -4px 7px rgba(0, 0, 0, 0.28);
    }
    .indicadores-title {
      width: calc(100% - 3mm); height: 39px; margin: 0 auto 16px;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,.9);
      background: linear-gradient(180deg, #E8EDF3 0%, #D8E0EA 55%, #C5CED9 100%);
      color: #000;
      font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', serif;
      font-size: 17px; font-weight: 400; letter-spacing: .06em;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow:
        0 4px 9px rgba(15, 23, 42, 0.2),
        inset 0 2px 3px rgba(255, 255, 255, 0.95),
        inset 0 -3px 5px rgba(100, 116, 139, 0.2);
    }
    .indicadores-title svg { width: 20px; height: 20px; flex-shrink: 0; }
    .indicadores {
      flex: 1; min-height: 0; padding: 20px 0 0; background: #B0C4DE;
    }
    .indicadores-content {
      padding: 0 12px 20px;
    }
    .indicadores-grid {
      display: flex; flex-direction: column; gap: 16px;
    }
    .indicadores-row {
      display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px;
      margin-left: 2mm;
    }
    .indicadores-row-top {
      flex-wrap: nowrap;
    }
    .qtc-wrap { display: flex; justify-content: flex-start; }
    .qtc-card {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      width: 72px;
    }
    .qtc-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; color: #1e293b; text-align: center; line-height: 1.2;
    }
    .qtc-box {
      width: 72px; height: 72px; border-radius: 12px;
      border: 1px solid rgba(187,247,208,.9);
      background: linear-gradient(180deg, #F0FDF4 0%, #DCFCE7 55%, #BBF7D0 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow:
        0 5px 11px rgba(15, 23, 42, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.85),
        inset 0 -4px 7px rgba(34, 197, 94, 0.15);
    }
    .qtc-box svg.ind-icon { width: 28px; height: 28px; color: #1e3a5f; }
    .qtc-value { margin-top: 2px; font-size: 15px; font-weight: 700; color: #0f172a; }
  </style>
</head>
<body>
  <header>
    <button class="icon" aria-label="Voltar">‹</button>
    <h1>RedMapa</h1>
  </header>
  <main>
    <div class="action-bar">
      <button class="tb config" type="button" aria-label="Configuração">
        <svg viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <span class="label">Configuração</span>
      </button>
      <button class="tb" type="button" aria-label="Oficina">
        <svg viewBox="0 0 24 24"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.3-1.1-.5-3.2-2-3.2H4.5c-1.5 0-2.3 2.1-2 3.2.3 1.1.8 2.8.8 2.8H6"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        <span>Oficina</span>
      </button>
    </div>
    <div class="section-divider"></div>
    <section class="indicadores">
      <button class="indicadores-title" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
          <rect x="6.5" y="13" width="3" height="5" rx="0.75" fill="#2563EB"/>
          <rect x="10.5" y="10" width="3" height="8" rx="0.75" fill="#16A34A"/>
          <rect x="14.5" y="7" width="3" height="11" rx="0.75" fill="#EA580C"/>
          <path d="M7 9.5 L11 8 L14.5 10 L17.5 6.5" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="17.5" cy="6.5" r="1.2" fill="#7C3AED"/>
        </svg>
        Indicadores
      </button>
      <div class="indicadores-content">
      <div class="indicadores-grid">
        <div class="indicadores-row indicadores-row-top">
          <div class="qtc-card">
            <span class="qtc-label">QTD/P(550)</span>
            <div class="qtc-box">
              <svg class="ind-icon pass-icon" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="3.25" stroke="#1e3a5f" stroke-width="1.75"/>
                <path d="M5.5 19.5c.6-2.8 2.8-4.5 6.5-4.5s5.9 1.7 6.5 4.5" stroke="#1e3a5f" stroke-width="1.75" stroke-linecap="round"/>
              </svg>
              <span class="qtc-value">42</span>
            </div>
          </div>
          <div class="qtc-card">
            <span class="qtc-label">OCUP</span>
            <div class="qtc-box">
              <svg class="ind-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
              </svg>
              <span class="qtc-value">78%</span>
            </div>
          </div>
          <div class="qtc-card">
            <span class="qtc-label">ATR/M</span>
            <div class="qtc-box">
              <svg class="ind-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 7v5l3 2" stroke-linecap="round"/>
              </svg>
              <span class="qtc-value">4m</span>
            </div>
          </div>
          <div class="qtc-card">
            <span class="qtc-label">PONT</span>
            <div class="qtc-box">
              <svg class="ind-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z"/>
                <circle cx="12" cy="11" r="2"/>
              </svg>
              <span class="qtc-value">24</span>
            </div>
          </div>
        </div>
        <div class="indicadores-row">
          <div class="qtc-card">
            <span class="qtc-label">INT/V</span>
            <div class="qtc-box">
              <svg class="ind-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <path d="M10 2h4"/><path d="M12 14v8"/><path d="M8 22h8"/>
                <path d="M9 2v6l-3 3"/><path d="M15 2v6l3 3"/>
              </svg>
              <span class="qtc-value">12m</span>
            </div>
          </div>
          <div class="qtc-card">
            <span class="qtc-label">KMT/D</span>
            <div class="qtc-box">
              <svg class="ind-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/>
                <path d="M8 19h8.5a2 2 0 0 0 1.7-1L20 8l-5-3-4 8H8"/>
              </svg>
              <span class="qtc-value">186</span>
            </div>
          </div>
        </div>
      </div>
      </div>
    </section>
    <div class="guia-divider"></div>
    <div class="bottom-actions">
      <div class="bottom-actions-buttons">
      <button class="btn-action" type="button">GUIA</button>
      <button class="btn-action" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
        Chegada |  Saída
      </button>
      </div>
    </div>
  </main>
</body>
</html>
